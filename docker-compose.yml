version: '2'
services:
    ralph_ui:
      entrypoint: ["npm", "start"]
      command: 
          npm install axios
      environment:
          NODE_ENV: development
      image: node:10.15-alpine
      ports:
          - "3000:3000"
      volumes:
          - ./sales-lead-app:/opt/ui
      working_dir: /opt/ui
    ralph_api_service:
        build: .
        ports:
            - "5000:5000"
        volumes:
            - ./SalesLead:/code
    database:
      image: mysql:5.6
      environment:
          MYSQL_ROOT_PASSWORD: hipages
          MYSQL_DATABASE: db_sales_lead 
      ports:
          - "3306:3306"
      volumes:
          - ./docker/mysql:/docker-entrypoint-initdb.d
